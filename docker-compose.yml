services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-closed-cras.json:/opt/keycloak/data/import/realm-closed-cras.json:ro
  oauth:
    build: .
    environment:
      PORT: 8088
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: closed-cras
      KEYCLOAK_CLIENT_ID: bff
      KEYCLOAK_CLIENT_SECRET: local-development-secret
      KEYCLOAK_TIMEOUT_MS: 5000
      SESSION_COOKIE_NAME: closed_cras_session
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    ports:
      - "8088:8088"
    depends_on:
      - keycloak