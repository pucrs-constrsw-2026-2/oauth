openapi: 3.1.0
info:
  title: Gateway de identidade ConstrSW
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      summary: Inicia uma sessão institucional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201': {description: Sessão criada}
        '400': {description: Entrada inválida}
        '401': {description: Credencial recusada}
        '503': {description: Keycloak indisponível}
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, format: email}
        password: {type: string, minLength: 1, writeOnly: true}