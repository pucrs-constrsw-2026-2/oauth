services:
  oauth:
    # Override local para o compose compartilhado, cujo health check usa Node.js.
    # Esta imagem Java oferece curl e segue o contrato GET /health -> HTTP 200.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(curl -fsS -o /dev/null -w '%{http_code}' \"$${OAUTH_INTERNAL_PROTOCOL}://127.0.0.1:$${OAUTH_INTERNAL_API_PORT}/health\")\" = \"200\"",
        ]
