# Override LOCAL, opcional, pra rodar o compose oficial do professor em Mac
# com Apple Silicon (M-series recentes) sem os dois problemas de ambiente
# relatados a ele (ver backend/oauth/infra-local/README.md): SIGILL da JVM
# do Keycloak e o healthcheck que depende de curl (que nao existe na imagem).
#
# Nao muda nada do docker-compose.yml oficial na raiz do repo - so
# adiciona/sobrescreve o necessario no servico "keycloak". Fica dentro de
# backend/oauth porque e o unico lugar onde o grupo03 tem permissao de
# commit; o docker-compose.yml e o Dockerfile oficiais do professor
# continuam intocados.
#
# Uso (a partir da raiz do repo base):
#   docker compose -f docker-compose.yml -f backend/oauth/docker-compose.override.yml up -d --build
services:
  keycloak:
    build:
      # mesmo build context oficial (tem o constrsw.json); so o Dockerfile
      # muda, pra um que mora aqui dentro do oauth.
      dockerfile: ../../../../backend/oauth/infra-local/keycloak.Dockerfile
    environment:
      # Bug conhecido do OpenJDK 21 em macOS 15.2+ com Apple Silicon recente
      # (M4): a JVM da SIGILL logo no bootstrap (System.registerNatives) por
      # causa de deteccao de SVE (Scalable Vector Extensions). Ver
      # https://github.com/keycloak/keycloak/issues/36008 e JDK-8345296.
      - JAVA_TOOL_OPTIONS=-XX:UseSVE=0
    healthcheck:
      # A imagem do Keycloak nao tem curl (nem dnf/microdnf pra instalar),
      # entao o healthcheck oficial (com curl) nao roda. Este aqui so
      # confirma que a porta de metrics esta aceitando conexao TCP, via
      # /dev/tcp (recurso builtin do bash, que ja existe na imagem porque o
      # kc.sh e um script bash).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_INTERNAL_METRICS_PORT}"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 20
