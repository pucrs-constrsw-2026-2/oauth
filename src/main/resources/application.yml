server:
  port: 8081

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:constrsw}
  client-id: ${KEYCLOAK_CLIENT_ID:oauth}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

spring:
  application:
    name: oauth
  security:
    oauth2:
      resourceserver:
        jwt:
          # validação local via JWKS - o Spring busca as chaves públicas
          # automaticamente em {issuer-uri}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_BASE_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:constrsw}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
