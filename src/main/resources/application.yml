server:
  port: ${OAUTH_INTERNAL_API_PORT:8081}

keycloak:
  base-url: ${KEYCLOAK_SERVER_URL:${KEYCLOAK_BASE_URL:http://keycloak:8080}}
  realm: ${KEYCLOAK_REALM:constrsw}
  client-id: ${KEYCLOAK_CLIENT_ID:oauth}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

spring:
  application:
    name: oauth
  security:
    oauth2:
      resourceserver:
        jwt:
          # validação local via JWKS - o Spring busca as chaves públicas
          # automaticamente em {issuer-uri}/protocol/openid-connect/certs
          issuer-uri: ${keycloak.base-url}/realms/${keycloak.realm}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never
