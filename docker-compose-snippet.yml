# Adicionar (ou descomentar, se já existir um placeholder) este serviço no
# docker-compose.yml do repo BASE, apontando o build context para o
# submódulo oauth (/backend/oauth):

  oauth:
    build:
      context: ./backend/oauth
    container_name: oauth
    ports:
      - "8081:8081"
    environment:
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - keycloak
