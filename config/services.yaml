parameters:
    env(KEYCLOAK_SERVER_URL): 'http://keycloak:8080'
    env(KEYCLOAK_INTERNAL_URL): '%env(KEYCLOAK_SERVER_URL)%'
    keycloak.base_url: '%env(KEYCLOAK_INTERNAL_URL)%'
    keycloak.realm: '%env(KEYCLOAK_REALM)%'
    keycloak.client_id: '%env(KEYCLOAK_CLIENT_ID)%'
    keycloak.client_secret: '%env(KEYCLOAK_CLIENT_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/Model/'
            - '../src/Domain/Exception/'
            - '../src/Application/DTO/'
            - '../src/Infrastructure/OpenApi/Attribute/'
            - '../src/Kernel.php'

    App\Infrastructure\Http\Controller\:
        resource: '../src/Infrastructure/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Infrastructure\Keycloak\Client\KeycloakHttpClient:
        arguments:
            $baseUrl: '%keycloak.base_url%'
            $realm: '%keycloak.realm%'
            $clientId: '%keycloak.client_id%'
            $clientSecret: '%keycloak.client_secret%'

    App\Infrastructure\Http\Listener\JsonExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 10 }

    # Inbound Ports (Use Cases) - Épico 2
    App\Domain\Port\Inbound\LoginUseCaseInterface: '@App\Application\UseCase\Auth\LoginUseCase'
    App\Domain\Port\Inbound\RefreshTokenUseCaseInterface: '@App\Application\UseCase\Auth\RefreshTokenUseCase'
    App\Domain\Port\Inbound\GetUserInfoUseCaseInterface: '@App\Application\UseCase\Auth\GetUserInfoUseCase'

    # Outbound Ports (Adapters) - Épico 2
    App\Domain\Port\Outbound\KeycloakAuthPortInterface: '@App\Infrastructure\Keycloak\Adapter\KeycloakAuthAdapter'

    # Inbound Ports (Use Cases) - Épico 3
    App\Domain\Port\Inbound\CreateUserUseCaseInterface: '@App\Application\UseCase\User\CreateUserUseCase'
    App\Domain\Port\Inbound\ListUsersUseCaseInterface: '@App\Application\UseCase\User\ListUsersUseCase'
    App\Domain\Port\Inbound\GetUserByIdUseCaseInterface: '@App\Application\UseCase\User\GetUserByIdUseCase'
    App\Domain\Port\Inbound\UpdateUserUseCaseInterface: '@App\Application\UseCase\User\UpdateUserUseCase'
    App\Domain\Port\Inbound\UpdatePasswordUseCaseInterface: '@App\Application\UseCase\User\UpdatePasswordUseCase'
    App\Domain\Port\Inbound\DisableUserUseCaseInterface: '@App\Application\UseCase\User\DisableUserUseCase'

    # Outbound Ports (Adapters) - Épico 3
    App\Domain\Port\Outbound\KeycloakUserPortInterface: '@App\Infrastructure\Keycloak\Adapter\KeycloakUserAdapter'

    # Inbound Ports (Use Cases) - Épico 4
    App\Domain\Port\Inbound\AuthorizeResourceUseCaseInterface: '@App\Application\UseCase\Authorization\AuthorizeResourceUseCase'

    # Outbound Ports (Adapters) - Épico 4
    App\Domain\Port\Outbound\KeycloakAuthorizationPortInterface: '@App\Infrastructure\Keycloak\Adapter\KeycloakAuthorizationAdapter'


